openapi: 3.1.0
info:
  title: Circlr session API
  version: "1.0.0"
  description: |
    Lane B (session branch) contract freeze. The Chrome extension and the
    companion UI build against this surface; no implementation lives on this
    endpoint yet beyond this description and the schemas mirrored in
    `src/lib/contracts.ts`.
servers:
  - url: /
    description: Next.js app origin (extension and side panel run against this)
tags:
  - name: session
paths:
  /session:
    post:
      tags: [session]
      summary: Mint a session uuid
      description: Returns the uuid, mode, and SSE event channel for a new session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionInitRequest"
      responses:
        "200":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionInitResponse"
  /session/{uuid}:
    get:
      tags: [session]
      summary: Fetch canonical session state (resume after refresh)
      description: |
        Returns the current `SessionSnapshot` for the given uuid. The
        extension/companion UI persists only the uuid in `localStorage`;
        after a refresh it re-hydrates by issuing this GET and then
        optionally opening `/events` for live updates.
      parameters:
        - in: path
          name: uuid
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionSnapshot"
        "404":
          description: Unknown uuid (process restarted or session expired)
  /session/{uuid}/material:
    post:
      tags: [session]
      summary: Ingest a capture
      description: |
        Extension pushes a screen capture. Body is a single JSON object; the
        JPEG is base64-encoded.
      parameters:
        - in: path
          name: uuid
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MaterialCapture"
      responses:
        "202":
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                required: [accepted]
                properties:
                  accepted:
                    type: boolean
                  deduped:
                    type: boolean
        "400":
          description: Malformed or non-JPEG capture
  /session/{uuid}/events:
    get:
      tags: [session]
      summary: Server-sent event stream
      description: |
        Long-lived `text/event-stream`. First event is always `snapshot`; later
        events are appended. Honors `Last-Event-ID` for replay.
      parameters:
        - in: path
          name: uuid
          required: true
          schema:
            type: string
            format: uuid
        - in: header
          name: Last-Event-ID
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Open SSE connection
          content:
            text/event-stream:
              schema:
                type: string
                description: |
                  Each event is JSON whose shape is described by
                  `SseEvent`. SSE wire format is `event: {type}\ndata: {json}\n\n`.
  /session/{uuid}/turn:
    post:
      tags: [session]
      summary: Student action (set mode, save draft, check, ask)
      parameters:
        - in: path
          name: uuid
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/SetModeTurn"
                - $ref: "#/components/schemas/SaveDraftTurn"
                - $ref: "#/components/schemas/RequestCheckTurn"
                - $ref: "#/components/schemas/AskTurn"
                - $ref: "#/components/schemas/IdkTurn"
              discriminator:
                propertyName: kind
                mapping:
                  setMode: "#/components/schemas/SetModeTurn"
                  saveDraft: "#/components/schemas/SaveDraftTurn"
                  requestCheck: "#/components/schemas/RequestCheckTurn"
                  ask: "#/components/schemas/AskTurn"
                  idk: "#/components/schemas/IdkTurn"
      responses:
        "202":
          description: Accepted
components:
  schemas:
    Mode:
      type: string
      enum: [assignment, review]
    AssessmentStatus:
      type: string
      enum: [blocked, on-track, solid]
    HintEscalation:
      type: string
      enum: [up, same, down]
    SessionInitRequest:
      type: object
      additionalProperties: false
    SessionInitResponse:
      type: object
      required: [uuid, eventsUrl]
      properties:
        uuid:
          type: string
          format: uuid
        eventsUrl:
          type: string
          format: uri
    MaterialCapture:
      type: object
      required: [pageIndex, scrollRatio, timestamp, hash, image]
      properties:
        pageIndex:
          type: integer
          minimum: 0
        scrollRatio:
          type: number
          minimum: 0
          maximum: 1
        timestamp:
          type: integer
          format: int64
        hash:
          type: string
          pattern: "^[0-9a-f]{16}$"
          description: 16-hex-char average hash from the capture dedupe layer
        image:
          type: string
          description: Base64-encoded JPEG (FFD8FF prefix)
    SetModeTurn:
      type: object
      required: [kind, mode]
      properties:
        kind:
          type: string
          enum: [setMode]
        mode:
          $ref: "#/components/schemas/Mode"
    SaveDraftTurn:
      type: object
      required: [kind, questionId, draft]
      properties:
        kind:
          type: string
          enum: [saveDraft]
        questionId:
          type: string
        draft:
          type: string
    RequestCheckTurn:
      type: object
      required: [kind, questionId]
      properties:
        kind:
          type: string
          enum: [requestCheck]
        questionId:
          type: string
    AskTurn:
      type: object
      required: [kind, questionId, message]
      properties:
        kind:
          type: string
          enum: [ask]
        questionId:
          type: string
        message:
          type: string
    IdkTurn:
      type: object
      required: [kind, questionId]
      properties:
        kind:
          type: string
          enum: [idk]
        questionId:
          type: string
          description: Student-initiated escape hatch — smallest unblock on this question
    QuestionBlock:
      type: object
      required: [id, index, text, status]
      properties:
        id:
          type: string
        index:
          type: integer
          minimum: 0
        text:
          type: string
        status:
          $ref: "#/components/schemas/AssessmentStatus"
    GhostSummaryEntry:
      type: object
      required: [ghostKey, severity, firstSeenAt, lastSeenAt, occurrences, silent]
      properties:
        ghostKey:
          type: string
        severity:
          $ref: "#/components/schemas/WatchSeverity"
        firstSeenAt:
          type: integer
        lastSeenAt:
          type: integer
        occurrences:
          type: integer
          minimum: 0
        silent:
          type: boolean
          description: true when the ghost has recurred past the intervention ladder's threshold
    ExtractedQuestion:
      type: object
      required: [id, index, text]
      properties:
        id:
          type: string
        index:
          type: integer
          minimum: 0
        text:
          type: string
    TutorTurn:
      type: object
      required: [questionId, hint, level, escalation]
      properties:
        questionId:
          type: string
        hint:
          type: string
          minLength: 1
        level:
          type: integer
          minimum: 0
          maximum: 3
        escalation:
          $ref: "#/components/schemas/HintEscalation"
    SessionSnapshot:
      type: object
      required: [uuid, captures, worksheet, drafts, ghostSummary, exportReady]
      properties:
        uuid:
          type: string
          format: uuid
        mode:
          $ref: "#/components/schemas/Mode"
        captures:
          type: array
          items:
            type: object
            required: [pageIndex, hash, timestamp]
            properties:
              pageIndex:
                type: integer
                minimum: 0
              hash:
                type: string
                pattern: "^[0-9a-f]{16}$"
              timestamp:
                type: integer
        worksheet:
          type: array
          items:
            $ref: "#/components/schemas/QuestionBlock"
        drafts:
          type: object
          additionalProperties:
            type: string
        ghostSummary:
          type: array
          items:
            $ref: "#/components/schemas/GhostSummaryEntry"
          description: Autopsy summary of every recurring ghost surfaced by the watcher.
        exportReady:
          type: boolean
    SseEvent:
      oneOf:
        - $ref: "#/components/schemas/SnapshotEvent"
        - $ref: "#/components/schemas/MaterialAcceptedEvent"
        - $ref: "#/components/schemas/ExtractionUpdateEvent"
        - $ref: "#/components/schemas/AssessmentTickEvent"
        - $ref: "#/components/schemas/TutorTurnEvent"
        - $ref: "#/components/schemas/FlagEvent"
        - $ref: "#/components/schemas/ErrorEvent"
      discriminator:
        propertyName: type
        mapping:
          snapshot: "#/components/schemas/SnapshotEvent"
          material.accepted: "#/components/schemas/MaterialAcceptedEvent"
          extraction.update: "#/components/schemas/ExtractionUpdateEvent"
          assessment.tick: "#/components/schemas/AssessmentTickEvent"
          tutor.turn: "#/components/schemas/TutorTurnEvent"
          flag: "#/components/schemas/FlagEvent"
          error: "#/components/schemas/ErrorEvent"
    SnapshotEvent:
      type: object
      required: [type, data]
      properties:
        type:
          type: string
          enum: [snapshot]
        data:
          $ref: "#/components/schemas/SessionSnapshot"
    MaterialAcceptedEvent:
      type: object
      required: [type, data]
      properties:
        type:
          type: string
          enum: ["material.accepted"]
        data:
          type: object
          required: [captureId, deduped]
          properties:
            captureId:
              type: string
            deduped:
              type: boolean
    ExtractionUpdateEvent:
      type: object
      required: [type, data]
      properties:
        type:
          type: string
          enum: ["extraction.update"]
        data:
          type: object
          required: [partial, questions]
          properties:
            partial:
              type: boolean
            questions:
              type: array
              items:
                $ref: "#/components/schemas/QuestionBlock"
    AssessmentTickEvent:
      type: object
      required: [type, data]
      properties:
        type:
          type: string
          enum: ["assessment.tick"]
        data:
          type: object
          required: [questionId, status, reasoning]
          properties:
            questionId:
              type: string
            status:
              $ref: "#/components/schemas/AssessmentStatus"
            reasoning:
              type: string
              minLength: 1
    TutorTurnEvent:
      type: object
      required: [type, data]
      properties:
        type:
          type: string
          enum: ["tutor.turn"]
        data:
          $ref: "#/components/schemas/TutorTurn"
    WatchSeverity:
      type: string
      enum: [low, medium, high]
    WatchVerdict:
      type: object
      required: [flag, reasoning]
      properties:
        flag:
          type: boolean
        severity:
          $ref: "#/components/schemas/WatchSeverity"
        ghostKey:
          type: string
          description: stable key for a recurring mistake (used by intervention ladder #23 for fading)
        reasoning:
          type: string
          minLength: 1
    FlagEvent:
      type: object
      required: [type, data]
      properties:
        type:
          type: string
          enum: [flag]
        data:
          type: object
          required: [questionId, severity, reasoning]
          properties:
            questionId:
              type: string
            severity:
              $ref: "#/components/schemas/WatchSeverity"
            ghostKey:
              type: string
            reasoning:
              type: string
              minLength: 1
    ErrorEvent:
      type: object
      required: [type, data]
      properties:
        type:
          type: string
          enum: [error]
        data:
          type: object
          required: [code, message, recoverable]
          properties:
            code:
              type: string
            message:
              type: string
            recoverable:
              type: boolean
