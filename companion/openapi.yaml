openapi: 3.1.0
info:
  title: Circlr session API
  version: "1.0.0"
  description: |
    Lane B (session branch) contract freeze. The Chrome extension and the
    companion UI build against this surface; no implementation lives on this
    endpoint yet beyond this description and the schemas mirrored in
    `src/lib/contracts.ts`.
servers:
  - url: /
    description: Next.js app origin (extension and side panel run against this)
tags:
  - name: session
paths:
  /session:
    post:
      tags: [session]
      summary: Mint a session uuid
      description: Returns the uuid, mode, and SSE event channel for a new session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionInitRequest"
      responses:
        "200":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionInitResponse"
  /session/{uuid}:
    get:
      tags: [session]
      summary: Fetch canonical session state (resume after refresh)
      description: |
        Returns the current `SessionSnapshot` for the given uuid. The
        extension/companion UI persists only the uuid in `localStorage`;
        after a refresh it re-hydrates by issuing this GET and then
        optionally opening `/events` for live updates.
      parameters:
        - in: path
          name: uuid
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionSnapshot"
        "404":
          description: Unknown uuid (process restarted or session expired)
  /session/{uuid}/material:
    post:
      tags: [session]
      summary: Ingest a capture
      description: |
        Extension pushes a screen capture. Body is a single JSON object; the
        JPEG is base64-encoded.
      parameters:
        - in: path
          name: uuid
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MaterialCapture"
      responses:
        "202":
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                required: [accepted]
                properties:
                  accepted:
                    type: boolean
                  deduped:
                    type: boolean
        "400":
          description: Malformed or non-JPEG capture
  /session/{uuid}/events:
    get:
      tags: [session]
      summary: Server-sent event stream
      description: |
        Long-lived `text/event-stream`. First event is always `snapshot`; later
        events are appended. Honors `Last-Event-ID` for replay.
      parameters:
        - in: path
          name: uuid
          required: true
          schema:
            type: string
            format: uuid
        - in: header
          name: Last-Event-ID
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Open SSE connection
          content:
            text/event-stream:
              schema:
                type: string
                description: |
                  Each event is JSON whose shape is described by
                  `SseEvent`. SSE wire format is `event: {type}\ndata: {json}\n\n`.
  /session/{uuid}/turn:
    post:
      tags: [session]
      summary: Student action (set mode, save draft, check, assess, ask)
      parameters:
        - in: path
          name: uuid
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
                - $ref: "#/components/schemas/SetModeTurn"
                - $ref: "#/components/schemas/SaveDraftTurn"
                - $ref: "#/components/schemas/RequestCheckTurn"
                - $ref: "#/components/schemas/AssessTurn"
                - $ref: "#/components/schemas/AskTurn"
                - $ref: "#/components/schemas/IdkTurn"
                - $ref: "#/components/schemas/AnnotateTurn"
                - $ref: "#/components/schemas/BoardPenTurn"
                - $ref: "#/components/schemas/BoardShapeTurn"
                - $ref: "#/components/schemas/BoardTextTurn"
                - $ref: "#/components/schemas/BoardEraserTurn"
                - $ref: "#/components/schemas/BoardRemoveTurn"
                - $ref: "#/components/schemas/BoardTextMoveTurn"
                - $ref: "#/components/schemas/BoardPenMoveTurn"
                - $ref: "#/components/schemas/BoardShapeMoveTurn"
              discriminator:
                propertyName: kind
                mapping:
                  setMode: "#/components/schemas/SetModeTurn"
                  saveDraft: "#/components/schemas/SaveDraftTurn"
                  requestCheck: "#/components/schemas/RequestCheckTurn"
                  assess: "#/components/schemas/AssessTurn"
                  ask: "#/components/schemas/AskTurn"
                  idk: "#/components/schemas/IdkTurn"
                  annotate: "#/components/schemas/AnnotateTurn"
                  board-pen: "#/components/schemas/BoardPenTurn"
                  board-shape: "#/components/schemas/BoardShapeTurn"
                  board-text: "#/components/schemas/BoardTextTurn"
                  board-eraser: "#/components/schemas/BoardEraserTurn"
                  board-remove: "#/components/schemas/BoardRemoveTurn"
                  board-text-move: "#/components/schemas/BoardTextMoveTurn"
                  board-pen-move: "#/components/schemas/BoardPenMoveTurn"
                  board-shape-move: "#/components/schemas/BoardShapeMoveTurn"
      responses:
        "202":
          description: Accepted
components:
  schemas:
    Mode:
      type: string
      enum: [assignment, review]
    AssessmentStatus:
      type: string
      enum: [blocked, on-track, solid]
    HintEscalation:
      type: string
      enum: [up, same, down]
    SessionInitRequest:
      type: object
      additionalProperties: false
    SessionInitResponse:
      type: object
      required: [uuid, eventsUrl]
      properties:
        uuid:
          type: string
          format: uuid
        eventsUrl:
          type: string
          format: uri
    MaterialCapture:
      type: object
      required: [pageIndex, scrollRatio, timestamp, hash, image]
      properties:
        pageIndex:
          type: integer
          minimum: 0
        scrollRatio:
          type: number
          minimum: 0
          maximum: 1
        timestamp:
          type: integer
          format: int64
        hash:
          type: string
          pattern: "^[0-9a-f]{16}$"
          description: 16-hex-char average hash from the capture dedupe layer
        image:
          type: string
          description: Base64-encoded JPEG (FFD8FF prefix)
    SetModeTurn:
      type: object
      required: [kind, mode]
      properties:
        kind:
          type: string
          enum: [setMode]
        mode:
          $ref: "#/components/schemas/Mode"
    SaveDraftTurn:
      type: object
      required: [kind, questionId, draft]
      properties:
        kind:
          type: string
          enum: [saveDraft]
        questionId:
          type: string
        draft:
          type: string
        image:
          type: string
          description: Optional base64-encoded JPEG (FFD8FF prefix) snapshot of the student's work for this turn
    RequestCheckTurn:
      type: object
      required: [kind, questionId]
      properties:
        kind:
          type: string
          enum: [requestCheck]
        questionId:
          type: string
        image:
          type: string
          description: Optional base64-encoded JPEG (FFD8FF prefix) snapshot of the student's work for this turn
    AssessTurn:
      type: object
      required: [kind, questionId]
      properties:
        kind:
          type: string
          enum: [assess]
        questionId:
          type: string
          description: Frontend-triggered Scout assessment; the Tutor speaks only if the verdict escalates
        image:
          type: string
          description: Optional base64-encoded JPEG (FFD8FF prefix) snapshot of the student's work for this turn
    AskTurn:
      type: object
      required: [kind, questionId, message]
      properties:
        kind:
          type: string
          enum: [ask]
        questionId:
          type: string
        message:
          type: string
        image:
          type: string
          description: Optional base64-encoded JPEG (FFD8FF prefix) snapshot of the student's work for this turn
    IdkTurn:
      type: object
      required: [kind, questionId]
      properties:
        kind:
          type: string
          enum: [idk]
        questionId:
          type: string
          description: Student-initiated escape hatch — smallest unblock on this question
        image:
          type: string
          description: Optional base64-encoded JPEG (FFD8FF prefix) snapshot of the student's work for this turn
    AnnotateTurn:
      type: object
      required: [kind, questionId, image]
      properties:
        kind:
          type: string
          enum: [annotate]
        questionId:
          type: string
          description: Board the agent should mark up
        image:
          type: string
          description: Base64-encoded JPEG (FFD8FF prefix) snapshot of the student's canvas
    BoardAuthor:
      type: string
      enum: [student, tutor]
    ShapeKind:
      type: string
      enum: [rect, ellipse, line, triangle]
    BoardPoint:
      type: object
      required: [x, y]
      properties:
        x:
          type: number
        y:
          type: number
    BoardPenElement:
      type: object
      required: [id, author, points]
      properties:
        id:
          type: string
        author:
          $ref: "#/components/schemas/BoardAuthor"
        points:
          type: array
          items:
            $ref: "#/components/schemas/BoardPoint"
        color:
          type: string
        strokeWidth:
          type: number
    BoardShapeElement:
      type: object
      required: [id, author, shape, x, y, width, height]
      properties:
        id:
          type: string
        author:
          $ref: "#/components/schemas/BoardAuthor"
        shape:
          $ref: "#/components/schemas/ShapeKind"
        x:
          type: number
        y:
          type: number
        width:
          type: number
        height:
          type: number
        color:
          type: string
        strokeWidth:
          type: number
    BoardTextElement:
      type: object
      required: [id, author, x, y, source]
      properties:
        id:
          type: string
        author:
          $ref: "#/components/schemas/BoardAuthor"
        x:
          type: number
        y:
          type: number
        source:
          type: string
        color:
          type: string
        width:
          type: number
        fontSize:
          type: number
        degraded:
          type: boolean
    BoardEraserMaskElement:
      type: object
      required: [id, author, points]
      properties:
        id:
          type: string
        author:
          $ref: "#/components/schemas/BoardAuthor"
        points:
          type: array
          items:
            $ref: "#/components/schemas/BoardPoint"
      description: Deprecated paint-mask eraser; ignored by the renderer
    BoardElement:
      oneOf:
        - $ref: "#/components/schemas/BoardPenElement"
        - $ref: "#/components/schemas/BoardShapeElement"
        - $ref: "#/components/schemas/BoardTextElement"
        - $ref: "#/components/schemas/BoardEraserMaskElement"
      description: A fully-normalized canvas element (server → SSE)
    BoardPenTurn:
      type: object
      required: [kind, element]
      properties:
        kind:
          type: string
          enum: ["board-pen"]
        element:
          $ref: "#/components/schemas/BoardPenElement"
    BoardShapeTurn:
      type: object
      required: [kind, element]
      properties:
        kind:
          type: string
          enum: ["board-shape"]
        element:
          $ref: "#/components/schemas/BoardShapeElement"
    BoardTextTurn:
      type: object
      required: [kind, element]
      properties:
        kind:
          type: string
          enum: ["board-text"]
        element:
          $ref: "#/components/schemas/BoardTextElement"
    BoardEraserTurn:
      type: object
      required: [kind, elementIds]
      properties:
        kind:
          type: string
          enum: ["board-eraser"]
        elementIds:
          type: array
          items:
            type: string
    BoardRemoveTurn:
      type: object
      required: [kind, elementId]
      properties:
        kind:
          type: string
          enum: ["board-remove"]
        elementId:
          type: string
    BoardTextMoveTurn:
      type: object
      required: [kind, elementId, x, y]
      properties:
        kind:
          type: string
          enum: ["board-text-move"]
        elementId:
          type: string
        x:
          type: number
        y:
          type: number
        width:
          type: number
        fontSize:
          type: number
    BoardPenMoveTurn:
      type: object
      required: [kind, elementId, dx, dy]
      properties:
        kind:
          type: string
          enum: ["board-pen-move"]
        elementId:
          type: string
        dx:
          type: number
        dy:
          type: number
    BoardShapeMoveTurn:
      type: object
      required: [kind, elementId, x, y, width, height]
      properties:
        kind:
          type: string
          enum: ["board-shape-move"]
        elementId:
          type: string
        x:
          type: number
        y:
          type: number
        width:
          type: number
        height:
          type: number
    QuestionBlock:
      type: object
      required: [id, index, text, status]
      properties:
        id:
          type: string
        index:
          type: integer
          minimum: 0
        text:
          type: string
        label:
          type: string
          minLength: 1
          description: Soft board title from the printed question label (e.g. 1a, 2)
        status:
          $ref: "#/components/schemas/AssessmentStatus"
    GhostSummaryEntry:
      type: object
      required: [ghostKey, severity, firstSeenAt, lastSeenAt, occurrences, silent]
      properties:
        ghostKey:
          type: string
        severity:
          $ref: "#/components/schemas/WatchSeverity"
        firstSeenAt:
          type: integer
        lastSeenAt:
          type: integer
        occurrences:
          type: integer
          minimum: 0
        silent:
          type: boolean
          description: true when the ghost has recurred past the intervention ladder's threshold
    ExtractedQuestion:
      type: object
      required: [id, index, text]
      properties:
        id:
          type: string
        index:
          type: integer
          minimum: 0
        text:
          type: string
        label:
          type: string
          minLength: 1
          description: Printed question label used as the board soft title
    TutorTurn:
      type: object
      required: [questionId, hint, level, escalation]
      properties:
        questionId:
          type: string
        hint:
          type: string
          minLength: 1
        level:
          type: integer
          minimum: 0
          maximum: 3
        escalation:
          $ref: "#/components/schemas/HintEscalation"
    SessionSnapshot:
      type: object
      required: [uuid, captures, worksheet, drafts, ghostSummary, exportReady]
      properties:
        uuid:
          type: string
          format: uuid
        mode:
          $ref: "#/components/schemas/Mode"
        captures:
          type: array
          items:
            type: object
            required: [pageIndex, hash, timestamp]
            properties:
              pageIndex:
                type: integer
                minimum: 0
              hash:
                type: string
                pattern: "^[0-9a-f]{16}$"
              timestamp:
                type: integer
        worksheet:
          type: array
          items:
            $ref: "#/components/schemas/QuestionBlock"
        drafts:
          type: object
          additionalProperties:
            type: string
        board:
          type: array
          items:
            $ref: "#/components/schemas/BoardElement"
          description: Current shared-canvas elements (student + tutor marks), for resume
        ghostSummary:
          type: array
          items:
            $ref: "#/components/schemas/GhostSummaryEntry"
          description: Autopsy summary of every recurring ghost surfaced by the watcher.
        exportReady:
          type: boolean
    SseEvent:
      oneOf:
        - $ref: "#/components/schemas/SnapshotEvent"
        - $ref: "#/components/schemas/MaterialAcceptedEvent"
        - $ref: "#/components/schemas/CaptureTriagedEvent"
        - $ref: "#/components/schemas/ExtractionUpdateEvent"
        - $ref: "#/components/schemas/AssessmentTickEvent"
        - $ref: "#/components/schemas/TutorTurnEvent"
        - $ref: "#/components/schemas/BoardElementEvent"
        - $ref: "#/components/schemas/BoardAnnotateEvent"
        - $ref: "#/components/schemas/BoardRemoveEvent"
        - $ref: "#/components/schemas/BoardTextMoveEvent"
        - $ref: "#/components/schemas/BoardPenMoveEvent"
        - $ref: "#/components/schemas/BoardShapeMoveEvent"
        - $ref: "#/components/schemas/FlagEvent"
        - $ref: "#/components/schemas/ErrorEvent"
      discriminator:
        propertyName: type
        mapping:
          snapshot: "#/components/schemas/SnapshotEvent"
          material.accepted: "#/components/schemas/MaterialAcceptedEvent"
          capture.triaged: "#/components/schemas/CaptureTriagedEvent"
          extraction.update: "#/components/schemas/ExtractionUpdateEvent"
          assessment.tick: "#/components/schemas/AssessmentTickEvent"
          tutor.turn: "#/components/schemas/TutorTurnEvent"
          board.element: "#/components/schemas/BoardElementEvent"
          board.annotate: "#/components/schemas/BoardAnnotateEvent"
          board.remove: "#/components/schemas/BoardRemoveEvent"
          board.text-move: "#/components/schemas/BoardTextMoveEvent"
          board.pen-move: "#/components/schemas/BoardPenMoveEvent"
          board.shape-move: "#/components/schemas/BoardShapeMoveEvent"
          flag: "#/components/schemas/FlagEvent"
          error: "#/components/schemas/ErrorEvent"
    SnapshotEvent:
      type: object
      required: [type, data]
      properties:
        type:
          type: string
          enum: [snapshot]
        data:
          $ref: "#/components/schemas/SessionSnapshot"
    MaterialAcceptedEvent:
      type: object
      required: [type, data]
      properties:
        type:
          type: string
          enum: ["material.accepted"]
        data:
          type: object
          required: [captureId, deduped]
          properties:
            captureId:
              type: string
            deduped:
              type: boolean
    CaptureTriagedEvent:
      type: object
      required: [type, data]
      properties:
        type:
          type: string
          enum: ["capture.triaged"]
        data:
          type: object
          required: [captureId, update, reason]
          properties:
            captureId:
              type: string
            update:
              type: boolean
              description: true when the capture should update the session context (extraction runs)
            reason:
              type: string
              minLength: 1
            novelty:
              $ref: "#/components/schemas/TriageNovelty"
    ExtractionUpdateEvent:
      type: object
      required: [type, data]
      properties:
        type:
          type: string
          enum: ["extraction.update"]
        data:
          type: object
          required: [partial, questions]
          properties:
            partial:
              type: boolean
            questions:
              type: array
              items:
                $ref: "#/components/schemas/QuestionBlock"
    AssessmentTickEvent:
      type: object
      required: [type, data]
      properties:
        type:
          type: string
          enum: ["assessment.tick"]
        data:
          type: object
          required: [questionId, status, reasoning]
          properties:
            questionId:
              type: string
            status:
              $ref: "#/components/schemas/AssessmentStatus"
            reasoning:
              type: string
              minLength: 1
    TutorTurnEvent:
      type: object
      required: [type, data]
      properties:
        type:
          type: string
          enum: ["tutor.turn"]
        data:
          $ref: "#/components/schemas/TutorTurn"
    BoardElementEvent:
      type: object
      required: [type, data]
      properties:
        type:
          type: string
          enum: ["board.element"]
        data:
          type: object
          required: [element]
          properties:
            element:
              $ref: "#/components/schemas/BoardElement"
            questionId:
              type: string
              description: Question board this element belongs to (Tutor marks); absent on legacy frames.
    BoardAnnotateEvent:
      type: object
      required: [type, data]
      properties:
        type:
          type: string
          enum: ["board.annotate"]
        data:
          type: object
          required: [questionId]
          properties:
            questionId:
              type: string
              description: Board whose previous Tutor marks should be cleared before the new batch
    BoardRemoveEvent:
      type: object
      required: [type, data]
      properties:
        type:
          type: string
          enum: ["board.remove"]
        data:
          type: object
          required: [elementId]
          properties:
            elementId:
              type: string
    BoardTextMoveEvent:
      type: object
      required: [type, data]
      properties:
        type:
          type: string
          enum: ["board.text-move"]
        data:
          type: object
          required: [elementId, x, y]
          properties:
            elementId:
              type: string
            x:
              type: number
            y:
              type: number
            width:
              type: number
            fontSize:
              type: number
    BoardPenMoveEvent:
      type: object
      required: [type, data]
      properties:
        type:
          type: string
          enum: ["board.pen-move"]
        data:
          type: object
          required: [elementId, dx, dy]
          properties:
            elementId:
              type: string
            dx:
              type: number
            dy:
              type: number
    BoardShapeMoveEvent:
      type: object
      required: [type, data]
      properties:
        type:
          type: string
          enum: ["board.shape-move"]
        data:
          type: object
          required: [elementId, x, y, width, height]
          properties:
            elementId:
              type: string
            x:
              type: number
            y:
              type: number
            width:
              type: number
            height:
              type: number
    WatchSeverity:
      type: string
      enum: [low, medium, high]
    WatchVerdict:
      type: object
      required: [flag, reasoning]
      properties:
        flag:
          type: boolean
        severity:
          $ref: "#/components/schemas/WatchSeverity"
        ghostKey:
          type: string
          description: stable key for a recurring mistake (used by intervention ladder #23 for fading)
        reasoning:
          type: string
          minLength: 1
    TriageNovelty:
      type: string
      enum: [new-questions, new-material, none]
    TriageVerdict:
      type: object
      required: [update, reason]
      properties:
        update:
          type: boolean
        reason:
          type: string
          minLength: 1
        novelty:
          $ref: "#/components/schemas/TriageNovelty"
    FlagEvent:
      type: object
      required: [type, data]
      properties:
        type:
          type: string
          enum: [flag]
        data:
          type: object
          required: [questionId, severity, reasoning]
          properties:
            questionId:
              type: string
            severity:
              $ref: "#/components/schemas/WatchSeverity"
            ghostKey:
              type: string
            reasoning:
              type: string
              minLength: 1
    ErrorEvent:
      type: object
      required: [type, data]
      properties:
        type:
          type: string
          enum: [error]
        data:
          type: object
          required: [code, message, recoverable]
          properties:
            code:
              type: string
            message:
              type: string
            recoverable:
              type: boolean
