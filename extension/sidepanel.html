<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Circlr Companion</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
      }
      #companion {
        width: 100%;
        height: 100%;
        border: 0;
      }
      #fallback {
        font-family: system-ui, sans-serif;
        padding: 16px;
      }
      #fallback button {
        margin-top: 8px;
      }
      pre {
        white-space: pre-wrap;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div id="fallback" hidden>
      <h3>Circlr</h3>
      <p id="status"></p>
      <button id="retry">Retry</button>
      <button id="settings">Settings</button>
    </div>
    <iframe id="companion" hidden allow="clipboard-write"></iframe>
    <script src="sidepanel.js" type="module"></script>
  </body>
</html>
