<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Circlr Settings</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        padding: 16px;
        max-width: 420px;
      }
      label {
        display: block;
        font-weight: 600;
        margin-bottom: 4px;
      }
      input {
        width: 100%;
        box-sizing: border-box;
        padding: 6px 8px;
      }
      .row {
        margin-top: 8px;
        display: flex;
        gap: 8px;
      }
      #status {
        margin-top: 12px;
        font-size: 13px;
      }
      .hint {
        color: #666;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <h2>Circlr Companion</h2>
    <label for="backendUrl">Backend URL</label>
    <input id="backendUrl" type="url" placeholder="http://localhost:3000" />
    <p class="hint">Used to start Sessions and embed the Companion pane.</p>
    <div class="row">
      <button id="save">Save</button>
      <button id="reset">Reset to default</button>
    </div>
    <p id="status"></p>
    <script src="options.js" type="module"></script>
  </body>
</html>
